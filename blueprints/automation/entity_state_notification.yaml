blueprint:
  name: "\U0001F4AC Entity State Notification"
  description: "\n## \U0001F4A5 New In Version 3\n\U0001F503 support for multiple states or nummeric comarision (above/below)\n\U0001F92F new logic for better troubleshooting and further development\n\U0001F4F1 multiple groups and devices for notifications possible\n\u26A1 numeric comparison can toggle between a fixed value or another entity, now reacting to changes in either entity\n\n## \U0001F919 Features\n\U0001F3AF monitor entities for a specific state and trigger a notification\n\U0001F4DD modify message, title, icon, color, channel, group etc\n\U0001F9F7 persistent notification until entity leaves specified state\n\U0001F504 periodical notification with stop functionality\n\U0001F3AC custom actions\n✅ custom conditions\n\nℹ️ **Hints**\nIf you want to test this automation, you need to change the state of an observed entity. You can do this in the developer options. Simply filter for your entity, select it and change the state to the trigger state manually.\n\n\U0001F4D6 **Documentation:** <a href=\"https://panhans.github.io/HomeAssistant/\">panhans.github.io/HomeAssistant/</a>\n\n⛑️ **Help &amp; FAQ**: <a href=\"https://community.home-assistant.io/t/entity-state-notification\">Entity State Notification</a>\n\n\U0001F4BF **Version**: 3.1.1\n\n                                      <img src=\"https://ko-fi.com/img/githubbutton_sm.svg\"> "
  domain: automation
  input:
    sensor_section:
      name: Entities / Equal Comparison
      icon: mdi:equal-box
      collapsed: true
      input:
        input_entities:
          name: "\U0001F5B2️ Observed Entities"
          description: '`target`


            Entities which trigger the notification.

            '
          default: []
          selector:
            entity:
              multiple: true
        input_entity_states:
          name: "\U0001F7E2 Entity States"
          description: '`target`


            Target state that triggers the automation.

            '
          default: []
          selector:
            text:
              multiple: true
              multiline: false
        input_entity_state_duration:
          name: ⏲️ State Duration
          description: '`target`

            Duration the entity must be in target state.

            '
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration: {}
    numeric_entity_section:
      name: Numeric Above/Below Comparison
      icon: mdi:code-greater-than
      collapsed: true
      input:
        input_numeric_entities:
          name: "\U0001F5B2️ Observed Numeric Entities"
          description: '`target`


            Entities which trigger the notification.

            '
          default: []
          selector:
            entity:
              multiple: true
        input_numeric_entity_operator:
          name: "\U0001F503 Operator"
          description: '`target`


            Operator to compare the state of the entity.

            '
          default: above
          selector:
            select:
              options:
              - label: ▶️ above
                value: above
              - label: ◀️ below
                value: below
              sort: false
              multiple: false
              custom_value: false
        input_numeric_compare_mode:
          name: "\U0001F500 Compare With"
          description: >-
            `target`


            Choose whether to compare the observed entity against a fixed
            value, or against the live value of another entity.
          default: fixed
          selector:
            select:
              options:
              - label: "\U0001F522 Fixed value"
                value: fixed
              - label: "\U0001F517 Another entity"
                value: entity
              sort: false
              multiple: false
              custom_value: false
        input_numeric_entity_state:
          name: "\U0001F7E2 Entity State"
          description: >-
            `target`


            Target value that triggers the automation. Only used when
            "Compare With" above is set to Fixed value.
          default: 0
          selector:
            number:
              max: 9999999999.0
              min: -9999999999.0
              step: 1.0
              mode: slider
        input_numeric_compare_entity:
          name: "\U0001F517 Compare Entity"
          description: >-
            `target`


            Another numeric entity to compare the observed entity against
            (e.g. sensor.outside_temperature, input_number.threshold). Only
            used when "Compare With" above is set to Another entity.
          default: sensor.select_an_entity
          selector:
            entity:
              filter:
              - domain:
                - sensor
                - input_number
                - number
        input_numeric_entity_state_duration:
          name: ⏲️ State Duration
          description: '`target`


            Duration the entity must be in target state.

            '
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration: {}
    mobile_notifcation_section:
      name: Mobile Notification Settings
      icon: mdi:chat
      collapsed: true
      input:
        input_notify_devices:
          name: "\U0001F4F1 Device to notify"
          description: '`notification`


            Devices that receive the notification.

            '
          default: []
          selector:
            device:
              multiple: true
              filter:
              - integration: mobile_app
        input_notify_groups:
          name: "\U0001FAC2 Notification Group"
          description: '`notification`


            Name of the notification groups.

            '
          default: []
          selector:
            text:
              multiple: true
              multiline: false
        input_title:
          name: "\U0001F4D5 Notification Title"
          description: '`notification`


            Title of the notification.

            '
          default: '{{ entity_name }} is {{ new_state }}'
        input_message:
          name: "\U0001F4AC Notification Message"
          description: '`notification`


            Message of the notification.

            '
          default: 'Keep in mind: {{ entity_name }} is {{ new_state }}'
        input_persistent_notification:
          name: "\U0001FAA8 Persistent Notification"
          description: '`notification`

            If turned on you can''t swipe away the notification. It only disappears
            if the observed entity leave the target state combined with the operator.

            '
          default: false
          selector:
            boolean: {}
        input_ha_notification:
          name: "\U0001F3E0 Persistent HomeAssistant Notification"
          description: '`notification`


            Creates a notification in your home assistant frontend.

            '
          default: false
          selector:
            boolean: {}
    mobile_appearance_section:
      name: Mobile Notification Appearance
      icon: mdi:palette
      collapsed: true
      input:
        input_status_bar_icon:
          name: "\U0001F320 Status Bar Icon"
          description: '`Android` `optional`


            Sets the status bar icon.

            '
          default: mdi:home-assistant
          selector:
            icon:
              placeholder: mdi:home-assistant
        input_notification_color:
          name: "\U0001F3A8 Notification Color"
          description: '`Android` `optional`


            Color of the notification.

            '
          default:
          - 100
          - 200
          - 240
          selector:
            color_rgb: {}
        input_channel:
          name: "\U0001F4ED Notification Channel"
          description: '`Android` `optional`


            You can set a notification channel. In your companion app you can set
            e.g. a custom sound for notifications in this channel.

            '
          default: General
        input_group:
          name: "\U0001F4D1 Notification Group"
          description: '`Android` `optional`


            Group notifications by using this identifier.

            '
          default: espn-notification-group
        input_vibration_pattern:
          name: "\U0001F4F3 Vibration Pattern"
          description: '`Android` `optional`


            Pattern of the vibration when notification arrives."

            '
          default: 100, 100
        input_led_color:
          name: "\U0001F4A1 Notification LED Color"
          description: '`Android` `optional`


            Color of the phone LED after incoming notification."

            '
          default:
          - 100
          - 200
          - 240
          selector:
            color_rgb: {}
    peridodic_notification_section:
      name: Periodic Notification Settings
      icon: mdi:refresh
      collapsed: true
      input:
        input_period:
          name: "\U0001F504 Periodical Notification"
          description: '`periodical` `notification`


            Sends notification periodically. 0 means off.

            '
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration: {}
        input_stop_button_text:
          name: "\U0001F4AC Stop Button Text"
          description: '`periodical` `optional`


            Text for stop button in the notification to interrupt the periodical send
            notifications.

            '
          default: Stop notifying
    custom_section:
      name: Custom Actions / Conditions
      icon: mdi:cog
      collapsed: true
      input:
        input_custom_condition:
          name: ❌ Conditions
          description: '`optional`


            Condition that must be met for the notification to be triggered.

            '
          default: []
          selector:
            condition: {}
        input_custom_action_on:
          name: "\U0001F3AC Custom Action On"
          description: '`optional`


            Custom action when your observed entity enters the target states.

            '
          default: []
          selector:
            action: {}
        input_custom_action_off:
          name: "\U0001F3AC Custom Action Off"
          description: '`optional`


            Custom action when observed entity leave the target state. Keep in mind
            this action also will be fired if your custom condition doesn''t match.

            '
          default: []
          selector:
            action: {}
  source_url: https://github.com/panhans/homeassistant/blob/main/blueprints/automation/panhans/entity_state_notification.yaml
trigger_variables:
  input_entities: !input input_entities
  numeric_compare_mode: !input input_numeric_compare_mode
  numeric_entities: !input input_numeric_entities
  numeric_compare_entity: !input input_numeric_compare_entity
trigger:
- id: state_on
  trigger: state
  entity_id: !input input_entities
  to: !input input_entity_states
  for: !input input_entity_state_duration
- id: state_off
  trigger: state
  entity_id: !input input_entities
  not_to: !input input_entity_states
- id: above
  trigger: numeric_state
  entity_id: !input input_numeric_entities
  above: !input input_numeric_entity_state
  for: !input input_numeric_entity_state_duration
  enabled: "{{ numeric_compare_mode == 'fixed' }}"
- id: above
  trigger: template
  value_template: >-
    {% set vals = numeric_entities | map('states') | map('float', -9999999999.0) | list %}
    {{ (vals | max if vals else -9999999999.0) > (states(numeric_compare_entity) | float(-9999999999.0)) }}
  for: !input input_numeric_entity_state_duration
  enabled: "{{ numeric_compare_mode == 'entity' }}"
- id: below
  trigger: numeric_state
  entity_id: !input input_numeric_entities
  below: !input input_numeric_entity_state
  for: !input input_numeric_entity_state_duration
  enabled: "{{ numeric_compare_mode == 'fixed' }}"
- id: below
  trigger: template
  value_template: >-
    {% set vals = numeric_entities | map('states') | map('float', 9999999999.0) | list %}
    {{ (vals | min if vals else 9999999999.0) < (states(numeric_compare_entity) | float(9999999999.0)) }}
  for: !input input_numeric_entity_state_duration
  enabled: "{{ numeric_compare_mode == 'entity' }}"
- id: above_off
  trigger: numeric_state
  entity_id: !input input_numeric_entities
  above: !input input_numeric_entity_state
  enabled: "{{ numeric_compare_mode == 'fixed' }}"
- id: above_off
  trigger: template
  value_template: >-
    {% set vals = numeric_entities | map('states') | map('float', -9999999999.0) | list %}
    {{ (vals | max if vals else -9999999999.0) > (states(numeric_compare_entity) | float(-9999999999.0)) }}
  enabled: "{{ numeric_compare_mode == 'entity' }}"
- id: below_off
  trigger: numeric_state
  entity_id: !input input_numeric_entities
  below: !input input_numeric_entity_state
  enabled: "{{ numeric_compare_mode == 'fixed' }}"
- id: below_off
  trigger: template
  value_template: >-
    {% set vals = numeric_entities | map('states') | map('float', 9999999999.0) | list %}
    {{ (vals | min if vals else 9999999999.0) < (states(numeric_compare_entity) | float(9999999999.0)) }}
  enabled: "{{ numeric_compare_mode == 'entity' }}"
- id: period
  trigger: event
  event_type: esn_event
  event_data:
    automation: '{{ this.entity_id }}'
variables:
  input_numeric_entity_operator: !input input_numeric_entity_operator
  input_numeric_entity_state: !input input_numeric_entity_state
  input_numeric_compare_mode: !input input_numeric_compare_mode
  input_numeric_compare_entity: !input input_numeric_compare_entity
  numeric_entities_list: !input input_numeric_entities
  numeric_threshold: >-
    {% if input_numeric_compare_mode == 'entity' %}
      {{ states(input_numeric_compare_entity) | float }}
    {% else %}
      {{ input_numeric_entity_state | float }}
    {% endif %}
  input_period: !input input_period
  input_notify_devices: !input input_notify_devices
  input_notify_groups: !input input_notify_groups
  input_notification_color: !input input_notification_color
  input_led_color: !input input_led_color
  input_stop_button_text: !input input_stop_button_text
  input_entity_states: !input input_entity_states
  is_period_trigger: '{{ trigger.id == ''period'' }}'
  now_ts: '{{ now() }}'
  is_perodical: '{{ as_datetime(now_ts) != as_datetime(now_ts) + timedelta(**input_period)
    }}'
  entity: >-
    {% if is_period_trigger %}
      {{ trigger.event.data.entity }}
    {% elif trigger.platform == 'template' %}
      {% set compare_val = states(input_numeric_compare_entity) | float(0) %}
      {% set result = namespace(e=numeric_entities_list[0]) %}
      {% for e in numeric_entities_list %}
        {% set v = states(e) | float(0) %}
        {% if trigger.id in ['above', 'above_off'] and v > compare_val %}
          {% set result.e = e %}
        {% elif trigger.id in ['below', 'below_off'] and v < compare_val %}
          {% set result.e = e %}
        {% endif %}
      {% endfor %}
      {{ result.e }}
    {% else %}
      {{ trigger.entity_id }}
    {% endif %}
  entity_name: '{{ state_attr(entity, ''friendly_name'') }}'
  action_tag: STOP_{{ this.entity_id }}_{{ entity }}
  tag: '{{ this.entity_id.split(''.'')[1] + entity.split(''.'')[1] }}'
  notification_color_hex: '#{{ ''%02x%02x%02x'' | format(input_notification_color[0],
    input_notification_color[1], input_notification_color[2]) }}'
  led_color_hex: '#{{ ''%02x%02x%02x'' | format(input_led_color[0], input_led_color[1],
    input_led_color[2]) }}'
  action: "{% if is_perodical %}\n  {{ [{'action': action_tag, 'title': input_stop_button_text}] }}\n{% else %}\n  {{ [] }}\n{% endif %}\n"
  trigger_change_ts: "{% if is_period_trigger %}\n  {{ trigger.event.data.last_changed }}\n{% else %}\n  {{ as_timestamp([entity] | expand | map(attribute='last_changed') | first) }}\n{% endif %}\n"
  new_state: >-
    {% if is_period_trigger %}
      {{ states(entity) }}
    {% elif trigger.platform == 'template' %}
      {{ states(entity) }}
    {% else %}
      {{ trigger.to_state.state }}
    {% endif %}
  old_state: >-
    {% if is_period_trigger %}
      {{ trigger.event.data.last_state }}
    {% elif trigger.platform == 'template' %}
      {{ states(input_numeric_compare_entity) }}
    {% else %}
      {{ trigger.from_state.state }}
    {% endif %}
  notify_devices: '{{ input_notify_devices | map(''device_attr'', ''name'') | list
    }}'
  notify: "{% set result = namespace(r=[]) %} {% for device in notify_devices %}\n  {% set result.r = result.r + ['notify.mobile_app_' + device | slugify] %}\n{% endfor %} {% for group in input_notify_groups %}\n  {% set result.r = result.r + ['notify.' + group] %}\n{% endfor %}\n{{ result.r }}\n"
  create_notifictaion: "{{ \n  trigger.id in ['state_on','period'] or \n  (trigger.id in ['above'] and input_numeric_entity_operator == 'above') or\n  (trigger.id in ['below'] and input_numeric_entity_operator == 'below')\n}}\n"
condition:
- condition: or
  conditions:
  - condition: template
    value_template: '{{ not create_notifictaion }}'
  - condition: and
    conditions:
    - condition: and
      conditions: !input input_custom_condition
    - condition: template
      value_template: '{{ create_notifictaion }}'
action:
- if:
  - condition: template
    value_template: '{{ create_notifictaion }}'
  then:
  - if:
    - condition: template
      value_template: !input input_ha_notification
    then:
    - action: persistent_notification.create
      data:
        title: !input input_title
        message: !input input_message
        notification_id: '{{ tag }}'
  - variables:
      custom_action_on: !input input_custom_action_on
  - if:
    - condition: template
      value_template: '{{ custom_action_on != none }}'
    then:
    - choose: []
      default: !input input_custom_action_on
  - repeat:
      count: '{{ notify | count | int }}'
      sequence:
      - variables:
          index: '{{ repeat.index-1 }}'
          notify_device: '{{ notify[index] }}'
      - action: '{{ notify_device }}'
        data:
          title: !input input_title
          message: !input input_message
          data:
            ttl: 0
            priority: high
            notification_icon: !input input_status_bar_icon
            tag: '{{ tag }}'
            persistent: !input input_persistent_notification
            sticky: !input input_persistent_notification
            channel: !input input_channel
            group: !input input_group
            color: '{{ notification_color_hex }}'
            vibrationPattern: !input input_vibration_pattern
            ledColor: '{{ led_color_hex }}'
            actions: '{{ action }}'
  - if:
    - condition: template
      value_template: '{{ is_perodical }}'
    then:
    - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_tag }}'
      timeout: !input input_period
    - variables:
        latest_state: '{{ states(entity) }}'
        latest_trigger_id: "{% if is_period_trigger %}\n  {{ trigger.event.data.trigger_id }}\n{% else %}\n  {{ trigger.id }}\n{% endif %}\n"
        latest_state_condition: >-
          {% if latest_trigger_id == 'state_on' %}
            {{ latest_state in input_entity_states }}
          {% elif latest_trigger_id == 'above' %}
            {{ latest_state | float > numeric_threshold }}
          {% elif latest_trigger_id == 'below' %}
            {{ latest_state | float < numeric_threshold }}
          {% endif %}
    - if:
      - condition: template
        value_template: '{{ latest_state_condition }}'
      - condition: template
        value_template: '{{ wait.trigger == none }}'
      then:
      - event: esn_event
        event_data:
          entity: '{{ entity }}'
          automation: '{{ this.entity_id }}'
          last_state: '{{ latest_state }}'
          trigger_id: '{{ latest_trigger_id }}'
  else:
  - action: notify.notify
    data:
      data:
        tag: '{{ tag }}'
        ttl: 0
        priority: high
      message: clear_notification
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ tag }}'
  - variables:
      custom_action_off: !input input_custom_action_off
  - if:
    - condition: template
      value_template: '{{ custom_action_off != none }}'
    then:
    - choose: []
      default: !input input_custom_action_off
mode: parallel
